<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>I Hear You has moved</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="canonical" href="https://cypherpunk.today/i-hear-you/">
<meta http-equiv="refresh" content="0; url=https://cypherpunk.today/i-hear-you/">
<style>
body{font:18px/1.5 system-ui,sans-serif;max-width:32rem;margin:20vh auto 0;padding:0 16px;text-align:center}
a{color:#0a58ca}
@media (prefers-color-scheme:dark){body{background:#111;color:#eee}a{color:#7ab4ff}}
</style>
<script>
(function () {
  var base = "/i-hear-you/";
  var p = location.pathname;
  var rest = p.indexOf(base) === 0 ? p.slice(base.length) : "";
  location.replace("https://cypherpunk.today/i-hear-you/" + rest + location.search + location.hash);
})();
</script>
</head>
<body>
<h1>I Hear You has moved</h1>
<p>The new address is <a href="https://cypherpunk.today/i-hear-you/">cypherpunk.today/i-hear-you</a>. You are being redirected.</p>
</body>
